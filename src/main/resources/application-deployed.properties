# Deployed profile: OpenAI models (proposed in plan T01). Secrets must come from the environment.
eka.ai.chat-provider=openai
eka.ai.embedding-provider=openai
eka.ai.chat-model=${EKA_CHAT_MODEL:gpt-4o-mini}
eka.ai.embedding-model=${EKA_EMBEDDING_MODEL:text-embedding-3-small}
eka.ai.embedding-dimensions=${EKA_EMBEDDING_DIMENSIONS:1536}
eka.ai.vector-table=${EKA_VECTOR_TABLE:vector_store_openai}

spring.ai.model.chat=${eka.ai.chat-provider}
spring.ai.model.embedding=${eka.ai.embedding-provider}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=${eka.ai.chat-model}
spring.ai.openai.embedding.options.model=${eka.ai.embedding-model}
spring.ai.vectorstore.pgvector.table-name=${eka.ai.vector-table}
spring.ai.vectorstore.pgvector.dimensions=${eka.ai.embedding-dimensions}

# OIDC resource server (Keycloak). Issuer is resolved lazily on first token validation.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${EKA_OIDC_ISSUER_URI}
