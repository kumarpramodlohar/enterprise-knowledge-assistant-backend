spring.application.name=EnterpriseKnowledgeAssitance
spring.profiles.default=local,oidc
spring.threads.virtual.enabled=true

# Database (credentials come from the environment; no defaults for secrets)
spring.datasource.url=${EKA_DB_URL:jdbc:postgresql://localhost:${EKA_DB_PORT:5433}/eka}
spring.datasource.username=${EKA_DB_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
spring.flyway.user=${EKA_DB_MIGRATION_USER:${EKA_DB_USER:postgres}}
spring.flyway.password=${EKA_DB_MIGRATION_PASSWORD:${POSTGRES_PASSWORD}}

# Upload limits (DEC-003)
eka.upload.max-file-size-bytes=10485760
spring.servlet.multipart.max-file-size=${eka.upload.max-file-size-bytes}B
spring.servlet.multipart.max-request-size=${eka.upload.max-request-size-bytes:11534336}B
eka.upload.allowed-extensions=pdf,docx,txt,md
eka.upload.max-file-name-length=255
eka.upload.max-metadata-length=100
eka.upload.max-tags=20
eka.upload.max-tag-length=50
eka.upload.default-content-type=application/octet-stream

# RAG defaults (DEC-007)
eka.chunking.size-tokens=800
eka.chunking.overlap-tokens=100
eka.retrieval.top-k=5
eka.retrieval.context-token-budget=4000
eka.retrieval.similarity-threshold=0.70
eka.ingestion.concurrency=2
eka.ingestion.provider-timeout=60s
eka.ingestion.max-retries=3
eka.ingestion.poll-interval=2s
eka.ingestion.retry-backoff=5s
# A RUNNING job not updated for this long is considered abandoned (crash/restart) and is re-queued
eka.ingestion.stale-after=15m
eka.ingestion.worker-enabled=${EKA_WORKER_ENABLED:true}
eka.ai.embedding-batch-size=32

# Only chat and embedding models are used; disable other Spring AI modalities
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none

# Extraction resource limits
eka.extraction.max-characters=12000000
eka.extraction.max-pages=500
# Zip-bomb guards for DOCX (POI ZipSecureFile)
eka.extraction.zip-min-inflate-ratio=0.01
eka.extraction.zip-max-entry-size-bytes=209715200

# Soft delete purge (DEC-006)
eka.retention.purge-after-days=7
eka.retention.purge-interval=1h
eka.retention.purge-batch-size=50
eka.retention.purge-enabled=${EKA_PURGE_ENABLED:true}

# Vector store: schema is owned by Flyway, one table per provider profile (DEC-002)
spring.ai.vectorstore.pgvector.initialize-schema=false
spring.ai.vectorstore.pgvector.schema-name=public

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
