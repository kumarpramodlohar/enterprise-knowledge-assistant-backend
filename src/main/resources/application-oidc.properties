# OIDC (Keycloak) token validation. Add to another profile, for example SPRING_PROFILES_ACTIVE=local,oidc,
# to use Keycloak sign-in with the local Ollama models. HTTP Basic is disabled while this profile is active.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${EKA_OIDC_ISSUER_URI:http://127.0.0.1:8180/realms/eka}
